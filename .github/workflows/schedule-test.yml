name: Schedule fire test (temporary)

# TEMPORARY diagnostic — delete this file once the test is done.
# Purpose: find out whether GitHub's scheduler fires cron triggers on this repo
# at all. Ten no-op ticks over the next ~hour; if ANY of them produce a run in
# the Actions tab tagged "Scheduled", then scheduling works here and this
# morning's missed 08:00 run was just GitHub dropping it. If none of the ten
# fire, that points to something systemic rather than bad luck.
#
# Times are UTC and assume it is roughly 08:45 UTC when you commit. Any tick
# already in the past when you push simply won't fire (harmless); the remaining
# future ticks still run the test. Minutes avoid :00 (the most-dropped slot).
on:
  schedule:
    - cron: "3 9 * * *"     # 09:03 UTC
    - cron: "10 9 * * *"    # 09:10
    - cron: "17 9 * * *"    # 09:17
    - cron: "24 9 * * *"    # 09:24
    - cron: "31 9 * * *"    # 09:31
    - cron: "38 9 * * *"    # 09:38
    - cron: "45 9 * * *"    # 09:45
    - cron: "52 9 * * *"    # 09:52
    - cron: "59 9 * * *"    # 09:59
    - cron: "6 10 * * *"    # 10:06 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Announce the fire
        run: echo "Schedule test fired at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
