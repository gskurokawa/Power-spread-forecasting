name: Daily spread update

# WHEN this runs.
#
# Scheduling is external: cron-job.org POSTs to the GitHub API workflow_dispatch
# endpoint each morning, before the day-ahead gate closure (noon local time), so the
# operational model writes a genuine pre-auction forecast. GitHub's own scheduled
# (cron) trigger is NOT used — it fired late or was silently dropped — so
# workflow_dispatch is the sole trigger. The run happens 7 days a week (the auction
# runs every day), and the 10-day refetch means a missed or late run loses nothing.
on:
  # The dispatch target cron-job.org calls, and the manual "Run workflow" button in
  # the Actions tab.
  workflow_dispatch:

# Never let two runs overlap (a slow run must finish before the next starts).
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45            # ENTSO-E can be slow; don't hang forever
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-daily.txt

      - name: Run the daily update
        env:
          # These come from the repo's encrypted secrets (Settings -> Secrets and
          # variables -> Actions). They are injected as environment variables,
          # exactly like your local .env — never written to the repo.
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python daily_update.py --lean
