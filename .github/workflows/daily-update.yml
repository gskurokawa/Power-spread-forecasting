name: Daily spread update

# WHEN this runs.
on:
  # Scheduled: 08:00 UTC, every day. The operational model forecasts BEFORE the
  # day-ahead auction, so this must run ahead of gate closure (noon local time):
  # 08:00 UTC is 10:00 CEST in summer and 09:00 CET in winter, comfortably before
  # the ~10:00 UTC (summer) / 11:00 UTC (winter) gate closure year-round. With the
  # 45-minute timeout below, a run started at 08:00 UTC always finishes before the
  # auction clears, so the forecast it writes genuinely precedes the market.
  #
  # Every day, not just weekdays: the day-ahead auction runs 7 days a week, so a
  # weekend forecast is a real forecast. ENTSO-E is flakier at weekends, but the
  # fetch retries and the updater's 10-day refetch buffer absorb transient misses,
  # and yesterday's still-NULL actual is backfilled once its auction has cleared.
  #
  # Note: this yields a true next-day (no-actual) forecast only when ENTSO-E has
  # already published tomorrow's day-ahead forecasts by run time. When it has not,
  # the run forecasts up to today and tomorrow is picked up on a later run; the
  # 10-day refetch means nothing is lost either way.
  schedule:
    - cron: "0 8 * * *"
  # Manual button in the Actions tab — use this to test on demand.
  workflow_dispatch:

# Never let two runs overlap (a slow run must finish before the next starts).
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45            # ENTSO-E can be slow; don't hang forever
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-daily.txt

      - name: Run the daily update
        env:
          # These come from the repo's encrypted secrets (Settings -> Secrets and
          # variables -> Actions). They are injected as environment variables,
          # exactly like your local .env — never written to the repo.
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python daily_update.py --lean
